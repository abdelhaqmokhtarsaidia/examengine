<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>ExamEngine — Transformez vos cours en examens</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e7ef;--p:#6366f1;--p2:#8b5cf6;--ok:#10b981;--ko:#ef4444;--wa:#f59e0b;--sh:0 10px 40px -12px rgba(30,41,90,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--card:#141726;--tx:#eef0ff;--mu:#9aa3c0;--bd:#262b45;--sh:0 10px 40px -12px #000}}
:root[data-theme="dark"]{--bg:#0b0d17;--card:#141726;--tx:#eef0ff;--mu:#9aa3c0;--bd:#262b45;--sh:0 10px 40px -12px #000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 85% -5%,#6366f133,transparent),radial-gradient(500px 400px at 0 20%,#8b5cf622,transparent)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:6px;padding:12px 20px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:19px;cursor:pointer;display:flex;gap:8px;align-items:center;margin-right:auto}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.nl{background:none;border:0;color:var(--mu);font:600 14px Inter,sans-serif;padding:8px 12px;border-radius:10px;cursor:pointer}.nl:hover{color:var(--tx);background:var(--card)}
main{max-width:920px;margin:0 auto;padding:28px 20px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;box-shadow:var(--sh);margin-bottom:18px}
h1{font-size:clamp(32px,6vw,54px);line-height:1.08;margin:0 0 16px;letter-spacing:-.03em;font-weight:800}
h2{font-size:22px;margin:0 0 14px;letter-spacing:-.02em}h3{margin:0 0 6px;font-size:16px}
.g{background:linear-gradient(135deg,var(--p),var(--p2),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu)}.hero{text-align:center;padding:50px 0 30px}.hero p{font-size:18px;max-width:560px;margin:0 auto 28px;color:var(--mu)}
.btn{border:0;border-radius:14px;padding:13px 22px;font:700 15px Inter,sans-serif;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 24px -8px var(--p);transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.big{padding:16px 30px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.row.l{justify-content:flex-start}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.feat{padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--bd)}.feat b{font-size:26px;display:block;margin-bottom:6px}
textarea,input[type=number],select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:150px;resize:vertical}label.t{font-weight:700;display:block;margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:9px 16px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}
.drop{border:2px dashed var(--bd);border-radius:16px;padding:22px;text-align:center;cursor:pointer;color:var(--mu)}.drop:hover{border-color:var(--p)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px;transition:width .4s}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}.tm{font:800 22px Inter;font-variant-numeric:tabular-nums;padding:8px 16px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}.tm.w{color:var(--ko);border-color:var(--ko)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--p)}.opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 12%,var(--bg))}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 14%,var(--bg))}
.opt b{min-width:26px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;font-size:13px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.nv{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:700 13px Inter;cursor:pointer}
.nv.a{background:color-mix(in srgb,var(--ok) 25%,var(--bg));border-color:var(--ok)}.nv.f{border-color:var(--wa);background:color-mix(in srgb,var(--wa) 25%,var(--bg))}.nv.c{outline:2px solid var(--p)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);margin:0 6px 10px 0}
.score{font-size:76px;font-weight:800;line-height:1}.kp{text-align:center;padding:16px;border-radius:16px;background:var(--bg);border:1px solid var(--bd)}.kp b{font-size:26px;display:block}
.th{display:flex;align-items:center;gap:12px;margin:10px 0}.th span:first-child{width:38%;font-size:14px}.th .bar{flex:1}.th span:last-child{width:44px;text-align:right;font-weight:700}
.ex{background:color-mix(in srgb,var(--p) 8%,var(--bg));border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--bd);border-top-color:var(--p);animation:r 1s linear infinite;margin:10px auto 20px}@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:50;box-shadow:var(--sh)}
.md p{margin:0 0 10px}.err{color:var(--ko);font-weight:600}
@media(max-width:560px){.th span:first-child{width:50%}main{padding:18px 14px 70px}}

h1,h2,.wm,.score{font-family:Sora,Inter,system-ui,sans-serif}
body:before{background:radial-gradient(700px 500px at 92% -10%,#6366f144,transparent),radial-gradient(600px 500px at -10% 8%,#ec489930,transparent),radial-gradient(520px 420px at 50% 112%,#06b6d430,transparent)}
body:after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#8b5cf655,transparent 65%);top:-140px;right:-140px;z-index:-1;filter:blur(24px);animation:fl 16s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-120px,160px) scale(1.25)}}
nav{padding:10px 22px}
.logo i{width:36px;height:36px;border-radius:12px;font-size:18px;box-shadow:0 8px 22px -6px var(--p)}
.logo span{display:flex;flex-direction:column;line-height:1.15}.logo small{font-family:Inter;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.card,.feat,.st,.pill{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card{border-radius:24px}
.hero{padding:44px 0 26px}
.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 16px;border-radius:99px;border:1px solid var(--bd);font-weight:600;font-size:13px;margin-bottom:22px}
.wm{font-size:clamp(46px,10vw,88px);font-weight:800;letter-spacing:-.045em;line-height:1}
.by{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);font-weight:600;margin:12px 0 36px}
.hero h1{font-size:clamp(24px,4.2vw,38px);max-width:700px;margin:0 auto 14px}
.hero p.wel{font-size:17px;max-width:600px}
.meta{margin-top:20px;font-size:13px;color:var(--mu)}
.btn{border-radius:16px;position:relative;overflow:hidden}
.btn:not(.s):after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#ffffff55,transparent 70%);transform:translateX(-120%);transition:.7s}.btn:not(.s):hover:after{transform:translateX(120%)}
.feat{padding:24px;border-radius:24px;position:relative;transition:.3s}.feat:hover{transform:translateY(-6px);box-shadow:0 26px 50px -22px #6366f190;border-color:#6366f166}
.ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 24px -8px #6366f1;margin-bottom:14px}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:28px 0 6px}
.st{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:99px;border:1px solid var(--bd);font-weight:600;font-size:14px}
.st i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:12px;font-style:normal}
.opt{border-radius:16px}.opt.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%,transparent)}.opt:hover{transform:translateX(3px)}
.top{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:5;padding:10px 14px;border-radius:20px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd)}
.tm{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0}.tm.w{background:linear-gradient(135deg,#ef4444,#f97316);animation:pl 1s infinite}@keyframes pl{50%{opacity:.65}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
main.fx>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}main.fx>*:nth-child(2){animation-delay:.07s}main.fx>*:nth-child(3){animation-delay:.14s}main.fx>*:nth-child(4){animation-delay:.21s}main.fx .feat:nth-child(2){animation:up .6s .1s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.cdt{font-size:1.15em;color:var(--wa);font-variant-numeric:tabular-nums}
.lock{border-color:var(--wa)!important}
</style></head><body>
<nav><div class="logo" onclick="go('home')"><i>⚡</i><span>ExamEngine<small>by MOKHTAR SAIDIA ABD ELHAQ</small></span></div>
<button class="nl" onclick="go('create')">Créer</button><button class="nl" onclick="go('history')">Mes examens</button><button class="nl" onclick="go('stats')">Statistiques</button>
<button class="nl" onclick="tt()" title="Thème">◐</button><small class="mu" id="sy" style="margin-left:4px">💾 Sur cet appareil</small></nav>
<main id="app"></main>
<footer style="text-align:center;padding:10px 20px 40px;color:var(--mu);font-size:13px">ExamEngine · by <b>MOKHTAR SAIDIA ABD ELHAQ</b></footer>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(x){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}},del(k){try{localStorage.removeItem(k)}catch(x){}}};
let V='home',C={src:'',paste:'',files:[],name:'',n:20,dur:30,lang:'Français',mode:'exam',types:['mcq','multi','tf','case']},E=null,R=null,timer=null,sample=null,DB=null,UID=null,H=[];
const HDR={'Content-Type':'application/json','X-Requested-With':'fetch'};
const store={async get(k){return LS.get('ee_'+k,null)},async set(k,v){try{localStorage.setItem('ee_'+k,JSON.stringify(v))}catch(x){toast('Espace de stockage du navigateur plein : supprimez d\'anciens examens.')}},async del(k){LS.del('ee_'+k)}};
async function loadH(){const d=await store.get('h');H=Array.isArray(d)?d:(d&&d.list)||[];const b=$('#qb');if(b)b.innerHTML=qtxt()}
const saveH=()=>store.set('h',{list:H.slice(0,100)});
let MAXDAY=2,USED=0,NEXT=0;
const fmtH=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const blocked=()=>NEXT>Date.now();
const qtxt=()=>`📅 Examens (24 h) : ${USED} / ${MAXDAY}`+(blocked()?` · ⏳ prochain examen dans <b class="cdt">${fmtH(NEXT-Date.now())}</b>`:'');
function setLim(d){if(!d||d.max==null)return;USED=d.used;MAXDAY=d.max;NEXT=d.retry_in>0?Date.now()+d.retry_in*1000:0;const b=$('#qb');if(b)b.innerHTML=qtxt();const g=$('#go');if(g&&!busy)g.disabled=blocked()}
async function refreshLimit(){try{setLim(await(await fetch('/api/me',{headers:HDR})).json())}catch(x){}}
setInterval(()=>{if(NEXT&&!blocked()){NEXT=0;refreshLimit().then(()=>{if(['home','create'].includes(V))render()})}document.querySelectorAll('.cdt').forEach(x=>x.textContent=fmtH(NEXT-Date.now()))},1000);
function hsh(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return(h>>>0).toString(36)}
const srcKey=ch=>'b_'+hsh(ch.map(c=>c.n).join('|')+'#'+ch.length+ch[0].t.slice(0,2000)+ch[ch.length>>1].t.slice(0,2000)+ch[ch.length-1].t.slice(-2000));
async function openEx(id){if(!id)return;const d=await store.get('x_'+id);if(!d)return toast('Examen introuvable.');R=d;V='results';render();scrollTo(0,0)}
async function delEx(id){if(!confirm('Supprimer cet examen ?'))return;await store.del('x_'+id);H=H.filter(x=>x.id!==id);await saveH();history()}
function tt(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark'}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function go(v){if(V==='exam'&&v!=='exam'&&E&&!E.done&&!confirm('Quitter l\'examen en cours ? Votre progression est sauvegardée.'))return;V=v;if(v!=='exam')clearInterval(timer);render();scrollTo(0,0)}
const L='ABCDEF',fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function render(){app.className=V!==render.l?'fx':'';render.l=V;({home,create,gen,exam,results,history,stats})[V]()}

function home(){const h=H,cur=LS.get('ee_cur'),hr=new Date().getHours(),gr=hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir';
app.innerHTML=`<div class="hero"><div class="pill">👋 ${gr} et bienvenue</div><div class="wm">Exam<span class="g">Engine</span></div><div class="by">by MOKHTAR SAIDIA ABD ELHAQ</div>
<h1>Transformez vos cours en <span class="g">examens réels</span>.</h1>
<p class="wel">Bienvenue ! Importez vos cours, laissez l'IA préparer votre examen, puis découvrez exactement ce qu'il vous reste à réviser.</p>
<div class="row" style="margin-top:26px"><button class="btn big" onclick="go('create')">Créer un examen</button><button class="btn s big" onclick="go('history')">Mes examens</button></div>
${cur&&cur.end>Date.now()?`<p style="margin-top:22px"><button class="btn s" onclick="resume()">▶ Reprendre « ${e(cur.title)} » (${fmt(Math.round((cur.end-Date.now())/1000))} restantes)</button></p>`:''}
${blocked()?`<div class="card lock" style="max-width:520px;margin:24px auto 0"><b>⏳ Limite quotidienne atteinte</b><div class="mu">Vous pourrez créer un nouvel examen dans <b class="cdt">${fmtH(NEXT-Date.now())}</b></div></div>`:''}<div class="meta">${qtxt()}${h.length?` · ${h.length} examen(s) réalisé(s) · moyenne ${Math.round(h.reduce((a,x)=>a+x.pct,0)/h.length)}%`:''}</div></div>
<div class="steps"><div class="st"><i>1</i>Importez</div><div class="st"><i>2</i>Générez</div><div class="st"><i>3</i>Passez l'examen</div><div class="st"><i>4</i>Analysez</div></div>
<div class="grid" style="margin-top:26px"><div class="feat"><div class="ic">📄</div><h3>Importez vos cours</h3><span class="mu">Plusieurs fichiers PDF, DOCX, PPTX, TXT, ou texte collé.</span></div>
<div class="feat"><div class="ic">🧠</div><h3>Questions par l'IA</h3><span class="mu">Mémorisation, compréhension et déduction, avec cas cliniques.</span></div>
<div class="feat"><div class="ic">⏱️</div><h3>Vraie simulation</h3><span class="mu">Minuteur, navigation, soumission automatique.</span></div>
<div class="feat"><div class="ic">📊</div><h3>Analyse détaillée</h3><span class="mu">Score par thème et plan de révision personnalisé.</span></div></div>`}

function chips(id,vals,cur,fn,suf=''){return vals.map(v=>`<button class="chip ${v==cur?'on':''}" onclick="${fn}(${v})">${v}${suf}</button>`).join('')}
function create(){const tp={mcq:'QCM',multi:'Réponses multiples',tf:'Vrai / Faux',case:'Cas clinique'};
app.innerHTML=`<h2>Nouvel examen</h2><div class="card"><label class="t" style="margin-top:0">1 · Source du cours</label>
<div class="drop" id="dz" onclick="$('#f').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();addFiles(event.dataTransfer.files)">📄 <b>Cliquez ou glissez vos fichiers</b><br><small>PDF, DOCX, PPTX, TXT — plusieurs fichiers à la fois, jusqu'à 100 Mo chacun</small></div><div id="fl"></div>
<input type="file" id="f" multiple accept=".pdf,.docx,.pptx,.txt,.md" hidden onchange="addFiles(this.files);this.value=''">
<textarea id="txt" placeholder="…ou collez votre cours ici" oninput="C.paste=this.value;cnt()" style="margin-top:12px">${e(C.paste)}</textarea><small class="mu" id="cnt"></small>
<div class="grid"><div><label class="t">2 · Nombre de questions (max 50)</label><input type="number" min="1" max="50" value="${C.n}" oninput="C.n=+this.value"></div><div><label class="t">3 · Durée (minutes)</label><input type="number" min="1" max="300" value="${C.dur}" oninput="C.dur=+this.value"></div></div>
<label class="t">4 · Types de questions</label><div class="row l">${Object.keys(tp).map(k=>`<button class="chip ${C.types.includes(k)?'on':''}" onclick="stg('${k}')">${tp[k]}</button>`).join('')}</div>
<div class="grid"><div><label class="t">Langue des questions</label><select onchange="C.lang=this.value">${['Français','العربية','English'].map(l=>`<option ${l==C.lang?'selected':''}>${l}</option>`).join('')}</select></div>
<div><label class="t">Mode</label><select onchange="C.mode=this.value"><option value="exam" ${C.mode=='exam'?'selected':''}>🎓 Examen (correction à la fin)</option><option value="train" ${C.mode=='train'?'selected':''}>🧪 Entraînement (correction immédiate)</option></select></div></div>
<p class="mu" style="font-size:13px;margin:16px 0">Difficulté élevée et automatique : l'IA mélange questions de mémorisation, de compréhension et de déduction/application.</p>
<p class="mu" id="qb" style="font-size:13px;margin:0 0 12px">${qtxt()}</p><button class="btn big" id="go" onclick="start()" ${blocked()?'disabled':''}>⚡ Générer l'examen</button></div>`;rf()}
const cnt=()=>{const x=$('#cnt');if(!x)return;const t=C.files.reduce((a,f)=>a+f.text.length,0)+C.paste.length;x.textContent=t?t.toLocaleString('fr')+' caractères au total':''};
const sn=v=>{C.n=v;create()},sd=v=>{C.dur=v;create()};
function stg(k){C.types=C.types.includes(k)?C.types.filter(x=>x!=k):[...C.types,k];if(!C.types.length)C.types=['mcq'];create()}
let busy=false;const mb=b=>(b/1048576).toFixed(b>10485760?0:1)+' Mo';
function rf(){const x=$('#fl');if(x)x.innerHTML=C.files.map((f,i)=>`<div class="th" style="margin:6px 0"><span style="width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${e(f.name)}</span><small class="mu" style="flex:1">${mb(f.size)} · ${f.err?'<span class="err">'+e(f.err)+'</span>':f.p<100?'lecture '+f.p+'%':(f.text.length/1000|0)+' k car.'}</small><button class="chip" onclick="C.files.splice(${i},1);rf()">✕</button></div>`).join('');cnt()}
const dec=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const yl=()=>new Promise(r=>setTimeout(r));
async function ex(f,rec){const n=f.name.toLowerCase();
if(n.endsWith('.pdf')){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const d=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,a=[];
for(let i=1;i<=d.numPages;i++){const pg=await d.getPage(i),tc=await pg.getTextContent();a.push(`\n[Page ${i}]\n`+tc.items.map(x=>x.str).join(' '));pg.cleanup();if(i%4==0){rec.p=Math.round(i/d.numPages*100);rf();await yl()}}
await d.destroy();return a.join('')}
if(n.endsWith('.docx')){const z=await JSZip.loadAsync(f);return dec((await z.file('word/document.xml').async('string')).replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,''))}
if(n.endsWith('.pptx')){const z=await JSZip.loadAsync(f),ks=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/g).pop())-parseInt(b.match(/\d+/g).pop()));let t='';
for(const k of ks){t+=`\n[Diapo ${k.match(/\d+/g).pop()}]\n`+dec((await z.file(k).async('string')).replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,''))}return t}
return await f.text()}
async function addFiles(list){busy=true;const g=$('#go');if(g)g.disabled=true;
for(const f of [...list]){const rec={name:f.name,size:f.size,text:'',p:0};C.files.push(rec);rf();await yl();
try{if(f.size>104857600)throw Error('big');rec.text=await ex(f,rec);if(rec.text.trim().length<80)rec.err='Peu de texte (PDF scanné ?)'}catch(x){rec.err=x.message==='big'?'Dépasse 100 Mo':'Lecture impossible'}
rec.p=100;rf()}
busy=false;const g2=$('#go');if(g2)g2.disabled=blocked()}
async function ai(){const call=async(p,kind)=>{let r;try{r=await fetch('/api/ai',{method:'POST',headers:HDR,body:JSON.stringify({prompt:p,kind})})}catch(x){throw{message:'Serveur injoignable.'}}
const d=await r.json().catch(()=>({}));if(!r.ok)throw{message:d.error||'Erreur IA ('+r.status+')'};if(d.switched)toast('↪ Bascule automatique vers '+d.provider);return d};
const s=async(p,o)=>({text:(await call(p,o?'analyse':'gen')).text});
s.json=async p=>{const t=(await call(p,'gen')).text,a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw{message:'Réponse IA invalide'};return JSON.parse(t.slice(a,b+1))};return s}
const TN={mcq:'mcq (4 options, 1 seule correcte)',multi:'multi (4-5 options, 2+ correctes)',tf:'tf (options ["Vrai","Faux"])',case:'case (cas clinique court puis question, 4 options, 1 correcte)'};
async function gen(){app.innerHTML=`<div class="card" style="text-align:center;padding:50px"><div class="spin"></div><h2 id="gs">Analyse du cours…</h2><div class="bar" style="max-width:360px;margin:auto"><i id="gb" style="width:5%"></i></div><p class="mu">Quelques instants, l'IA rédige vos questions.</p></div>`}
function buildChunks(){const out=[],add=(n,t)=>{t=t.replace(/[ \t]+/g,' ');let i=0;while(i<t.length){let j=Math.min(i+20000,t.length);if(j<t.length){const c=Math.max(t.lastIndexOf('\n',j),t.lastIndexOf('. ',j));if(c>i+12000)j=c+1}if(t.slice(i,j).trim().length>150)out.push({n,t:t.slice(i,j)});i=j}};
C.files.forEach(f=>add(f.name,f.text));if(C.paste.trim())add('Texte collé',C.paste);return out}
async function start(){if(busy)return toast('Lecture des fichiers en cours…');await ready;let sr;try{sr=await fetch('/api/exam/start',{method:'POST',headers:HDR})}catch(x){return toast('Serveur injoignable.')}const sd=await sr.json().catch(()=>({}));setLim(sd);if(!sr.ok){if(['home','create'].includes(V))render();return toast(sd.error||'Limite atteinte.')}C.chunks=buildChunks();if(C.chunks.length)C.bk=srcKey(C.chunks);else if(!C.files.length&&!C.paste.trim()&&!C.bk)return toast('Ajoutez un cours (fichiers ou texte collé).');
C.n=Math.min(50,Math.max(1,Math.round(C.n)||20));C.dur=Math.min(300,Math.max(1,Math.round(C.dur)||30));
if(C.files.length||C.paste.trim())C.title=C.files.length>1?C.files.length+' fichiers':C.files.length?C.files[0].name.replace(/\.\w+$/,''):'Texte collé';V='gen';gen();
try{const bank=(await store.get(C.bk))||{nextId:1,qs:[]},ok=q=>!q.used&&q.lang===C.lang&&C.types.includes(q.type);let pool=bank.qs.filter(ok);
if(pool.length<C.n){if(!C.chunks.length)throw{message:'Pas assez de questions en réserve : réimportez vos fichiers pour en générer de nouvelles.'};
const g=Math.min(75,(C.n-pool.length)+Math.round(C.n*.5));
const fresh=await makeQs(C.chunks,g,C.lang,C.types,(d,t)=>{$('#gb').style.width=Math.round(8+d/t*90)+'%';$('#gs').textContent=`Génération des questions ${d}/${t}…`},bank.qs);
fresh.forEach(q=>bank.qs.push({...q,id:bank.nextId++,lang:C.lang,used:false}));
if(bank.qs.length>150)bank.qs=bank.qs.filter(q=>!q.used).concat(bank.qs.filter(q=>q.used)).slice(0,150);pool=bank.qs.filter(ok)}
else{$('#gs').textContent='Tirage depuis votre réserve de questions…'}
const pick=pool.sort(()=>Math.random()-.5).slice(0,C.n);if(!pick.length)throw{message:'Aucune question disponible.'};pick.forEach(q=>q.used=true);store.set(C.bk,bank);
const qs=pick.map(q=>({...q}));
E={qs,ans:qs.map(()=>[]),flag:[],rev:qs.map(()=>false),i:0,start:Date.now(),end:Date.now()+C.dur*60000,dur:C.dur,mode:C.mode,title:C.title,lang:C.lang,types:C.types,done:false};
save();V='exam';render()}catch(x){fetch('/api/exam/cancel',{method:'POST',headers:HDR}).then(r=>r.json()).then(setLim).catch(()=>{});V='create';render();app.insertAdjacentHTML('afterbegin',`<p class="err">⚠ ${e(x.code==='not_granted'?'Autorisation IA refusée. Réessayez et acceptez.':x.message||'Erreur de génération')}</p>`)}}
async function makeQs(chunks,n,lang,types,prog,prev=[]){const s=await ai();if(!s)throw{message:'L\'IA est indisponible dans cette vue.'};
const nb=Math.max(Math.ceil(n/10),Math.min(Math.ceil(n/8),chunks.length)),per=Math.ceil(n/nb),off=Math.random();let out=[],seen=new Set(prev.map(q=>q.question.toLowerCase().replace(/\W/g,'').slice(0,60))),fails=0;
for(let b=0;b<nb*2&&out.length<n;b++){const bi=b%nb,ci=(Math.floor(((bi+off)/nb)*chunks.length)+Math.floor(b/nb))%chunks.length,ch=chunks[ci],k=b<nb?Math.min(per,n-out.length):n-out.length;
const p=`Tu es un concepteur d'examens universitaires exigeants (médecine/dentaire/sciences). À partir UNIQUEMENT de l'extrait de cours ci-dessous, rédige ${k} questions d'examen en ${lang}.
Règles: basées sur le cours (aucune invention); une réponse valide claire; distracteurs très plausibles et proches; énoncés précis; pas de doublon de concept.
Répartition cognitive (champ "skill"): ~35% "recall" = mémorisation (définitions, chiffres, classifications, listes, critères à retenir); ~65% "understand" (compréhension: mécanismes, causes, "pourquoi") ou "infer" (déduction/application: cas cliniques, diagnostic, conduite à tenir, conséquences, comparaison, combiner plusieurs notions).
Difficulté globale ÉLEVÉE (champ "difficulty", jamais dite à l'étudiant): ~15% easy, 45% medium, 40% hard. Les "hard" exigent de combiner plusieurs concepts ou de raisonner, avec distracteurs subtils.
Types autorisés: ${types.map(t=>TN[t]).join('; ')}.
${(prev.length||out.length)?'Concepts déjà posés (ne pas répéter): '+[...prev,...out].slice(-40).map(q=>q.question.slice(0,80)).join(' | '):''}
Réponds UNIQUEMENT par un JSON: {"questions":[{"type":"mcq|multi|tf|case","skill":"recall|understand|infer","question":"...","options":["..."],"correct":[index 0-based],"explanation":"pourquoi la bonne réponse est juste et les autres fausses","topic":"thème court","difficulty":"easy|medium|hard","source":"section/page du cours"}]}
Les options ne doivent PAS contenir de lettres A/B/C.
EXTRAIT (fichier: ${ch.n}):\n"""${ch.t}"""`;
let r;try{r=await s.json(p,{cache:false})}catch(x){if(x.code==='not_granted')throw x;if(++fails>2)throw x;continue}
const arr=(r.questions||r||[]).filter(q=>q&&q.question&&Array.isArray(q.options)&&q.options.length>=2&&Array.isArray(q.correct)&&q.correct.length&&q.correct.every(i=>i>=0&&i<q.options.length));
for(const q of arr){const key=q.question.toLowerCase().replace(/\W/g,'').slice(0,60);if(!seen.has(key)&&out.length<n){seen.add(key);out.push({...q,topic:q.topic||'Général',difficulty:q.difficulty||'medium'})}}
prog(out.length,n)}
if(!out.length)throw{message:'Aucune question valide générée. Réessayez.'};
for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}

const save=()=>{if(E&&!E.done)LS.set('ee_cur',E)};

function exam(){const q=E.qs[E.i],a=E.ans[E.i],tr=E.mode==='train'&&E.rev[E.i],multi=q.type==='multi';
const answered=E.ans.filter(x=>x.length).length;
app.innerHTML=`<div class="top"><div style="flex:1"><b>Question ${E.i+1} / ${E.qs.length}</b><div class="bar" style="margin-top:6px"><i style="width:${(E.i+1)/E.qs.length*100}%"></i></div></div><div class="tm" id="tm">⏱ ${fmt(Math.round((E.end-Date.now())/1000))}</div><button class="btn s" onclick="finish(false)">Terminer ✓</button></div>
<div class="card"><span class="tag">${e(q.topic)}</span>${multi?'<span class="tag">Plusieurs réponses</span>':''}${q.type==='case'?'<span class="tag">Cas clinique</span>':''}
<h3 style="font-size:19px;margin-bottom:18px;line-height:1.5">${e(q.question)}</h3>
${q.options.map((o,i)=>{let c=a.includes(i)?'sel':'';if(tr)c=q.correct.includes(i)?'ok':a.includes(i)?'ko':'';return `<button class="opt ${c}" onclick="pick(${i})"><b>${L[i]}</b><span>${e(o)}</span></button>`}).join('')}
${tr?`<div class="ex">💡 ${e(q.explanation)}</div>`:''}
<div class="row l" style="margin-top:18px;justify-content:space-between"><button class="btn s" onclick="mv(-1)" ${E.i?'':'disabled'}>← Précédente</button>
<button class="btn s" onclick="E.flag=E.flag.includes(E.i)?E.flag.filter(x=>x!=E.i):[...E.flag,E.i];save();exam()">${E.flag.includes(E.i)?'⚑ Marquée':'⚐ Marquer'}</button>
${E.mode==='train'&&!tr?`<button class="btn" onclick="E.rev[E.i]=true;exam()" ${a.length?'':'disabled'}>Valider</button>`:''}
${E.i<E.qs.length-1?`<button class="btn" onclick="mv(1)">Suivante →</button>`:`<button class="btn" onclick="finish(false)">Terminer ✓</button>`}</div></div>
<div class="card"><b>Navigation</b> <span class="mu">· ${answered}/${E.qs.length} répondues</span><div class="nav">${E.qs.map((_,i)=>`<button class="nv ${E.ans[i].length?'a':''} ${E.flag.includes(i)?'f':''} ${i==E.i?'c':''}" onclick="E.i=${i};save();exam()">${i+1}</button>`).join('')}</div>
<p style="text-align:right;margin:14px 0 0"><button class="btn s" onclick="finish(false)">Terminer l'examen</button></p></div>`;
clearInterval(timer);timer=setInterval(tick,1000)}
function pick(i){if(E.mode==='train'&&E.rev[E.i])return;const q=E.qs[E.i],a=E.ans[E.i];
E.ans[E.i]=q.type==='multi'?(a.includes(i)?a.filter(x=>x!=i):[...a,i].sort()):[i];save();exam()}
const mv=d=>{E.i+=d;save();exam()};
function tick(){const s=Math.round((E.end-Date.now())/1000),t=$('#tm');if(!t)return;t.textContent='⏱ '+fmt(s);t.classList.toggle('w',s<=300);
if(s===300)toast('⚠️ Il reste moins de 5 minutes.');if(s===60)toast('⚠️ Attention ! Il reste 1 minute.');if(s<=0){clearInterval(timer);toast('Temps écoulé — soumission automatique.');finish(true)}}
function finish(auto){const un=E.ans.filter(x=>!x.length).length;
if(!auto&&!confirm(`Terminer l'examen maintenant ?\n\n${E.qs.length-un} répondues · ${un} non répondues\nTemps restant : ${fmt(Math.round((E.end-Date.now())/1000))}`))return;
clearInterval(timer);E.done=true;const ok=(q,a)=>a.length===q.correct.length&&q.correct.every(i=>a.includes(i));
const th={};let c=0,w=0;E.qs.forEach((q,i)=>{const a=E.ans[i],t=th[q.topic]||(th[q.topic]={ok:0,n:0});t.n++;if(!a.length)return;if(ok(q,a)){c++;t.ok++}else w++});
const used=Math.round((Math.min(Date.now(),E.end)-E.start)/1000);
R={id:Date.now().toString(36),bk:C.bk,title:E.title,date:new Date().toISOString(),n:E.qs.length,c,w,u:E.qs.length-c-w,pct:Math.round(c/E.qs.length*100),used,th,qs:E.qs,ans:E.ans,src:E.src,cfg:{n:E.qs.length,dur:E.dur,lang:E.lang,types:E.types,mode:E.mode},ana:''};
store.set('x_'+R.id,R);H.unshift({id:R.id,title:R.title,date:R.date,n:R.n,pct:R.pct,used,th});H=H.slice(0,100);saveH();LS.del('ee_cur');V='results';render()}
